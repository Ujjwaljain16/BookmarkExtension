<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fuze Web Clipper</title>
  <link rel="stylesheet" type="text/css" href="popup.css">
</head>
<body>
  <div class="header">
    <svg class="logo" width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="url(#fuzeGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="url(#fuzeGradient)"/>
      <defs>
        <linearGradient id="fuzeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#4DD0E1;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#14B8A6;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
        </linearGradient>
      </defs>
    </svg>
    <h1>Fuze Web Clipper</h1>
  </div>

  <div id="main-form">
    <form id="bookmark-form">
      <div class="form-group">
        <label for="url">URL</label>
        <input type="url" id="url" readonly>
      </div>
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title">
      </div>
      <div class="form-group">
        <label for="description">Description (optional)</label>
        <textarea id="description" placeholder="Add a short description..."></textarea>
      </div>
      <div class="form-group">
        <label for="tags">Tags (comma separated)</label>
        <input type="text" id="tags" placeholder="tag1, tag2, tag3">
      </div>
      <button type="submit" id="save-btn" class="btn">Save to Fuze</button>
    </form>

    <div id="status-message" class="status" role="status"></div>

    <div class="form-footer">
      <span id="connection-status">Checking...</span>
      <a href="#" id="settings-link" class="settings-link">Settings</a>
    </div>

    <div id="auth-prompt" class="auth-prompt" hidden>
      <div class="auth-prompt-content">
        <div class="auth-prompt-header">
          <h3>Connect to Fuze</h3>
          <p>Sign in on the Fuze website with Google or email. The extension connects by itself.</p>
        </div>
        <div class="auth-prompt-actions">
          <button id="login-redirect-btn" class="btn">Sign in to Fuze</button>
        </div>
        <div class="auth-prompt-footer">
          <span>New to Fuze?</span> <a href="#" id="signup-link">Create an account</a>
          <span class="sep" aria-hidden="true">&middot;</span>
          <a href="#" id="extension-settings-link">Use email</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../lib/config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
