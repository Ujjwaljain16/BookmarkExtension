<!DOCTYPE html>
<html>
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="popup.css">
  <title>Fuze Web Clipper</title>
  <meta charset="utf-8">
</head>
<body>
  <div class="header">
    <svg class="logo" width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Lightning bolt icon matching Fuze favicon -->
      <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="url(#fuzeGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="url(#fuzeGradient)"/>
      <defs>
        <linearGradient id="fuzeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#4DD0E1;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#14B8A6;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
        </linearGradient>
      </defs>
    </svg>
    <h1>Fuze Web Clipper</h1>
  </div>

  <div id="main-form">
    <form id="bookmark-form">
      <div class="form-group">
        <label for="url">URL</label>
        <input type="url" id="url" readonly>
      </div>
      
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title">
      </div>
      
      <div class="form-group">
        <label for="description">Description (optional)</label>
        <textarea id="description" placeholder="Add a short description..."></textarea>
      </div>
      
      <div class="form-group">
        <label for="tags">Tags (comma separated)</label>
        <input type="text" id="tags" placeholder="tag1, tag2, tag3">
      </div>
      
      <button type="submit" class="btn">Save to Fuze</button>
    </form>
    
    <div id="status-message" class="status"></div>
    
    <div class="form-footer">
      <span id="connection-status">Not connected</span>
      <a href="#" id="settings-link" class="settings-link">Settings</a>
    </div>

    <!-- Auth prompt overlay (shown when not authenticated) -->
    <div id="auth-prompt" class="auth-prompt" style="display: none;">
      <div class="auth-prompt-content">
        <div class="auth-prompt-header">
          <h3>🔗 Connect to Fuze</h3>
          <p>Login to your Fuze account to save bookmarks</p>
        </div>
        <div class="auth-prompt-actions">
          <button id="login-redirect-btn" class="btn" style="background: linear-gradient(to right, #6366f1, #3b82f6); font-weight: 600;">Sign In via Web Platform</button>
          <button id="google-auth-btn" class="btn" style="background: #4285F4; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600;">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#FFF" d="M21.35 11.1H12v3.8h5.36c-.23 1.25-.94 2.31-2 3.03v2.52h3.24c1.9-1.75 2.99-4.32 2.99-7.4 0-.72-.07-1.42-.24-1.95z"/><path fill="#FFF" d="M12 21c2.7 0 4.96-.9 6.62-2.45l-3.24-2.52c-.9.6-2.05.97-3.38.97-2.6 0-4.8-1.76-5.59-4.12H3.14v2.6C4.78 18.73 8.14 21 12 21z"/><path fill="#FFF" d="M6.41 12.88c-.2-.6-.31-1.24-.31-1.88s.11-1.28.31-1.88V6.52H3.14C2.41 7.98 2 9.64 2 11.4s.41 3.42 1.14 4.88l3.27-2.52z"/><path fill="#FFF" d="M12 5.38c1.47 0 2.79.5 3.83 1.49l2.87-2.87C16.95 2.29 14.7 1.4 12 1.4 8.14 1.4 4.78 3.67 3.14 6.52l3.27 2.52c.79-2.36 2.99-4.12 5.59-4.12z"/></svg>
            Sign in with Google
          </button>
          <button id="signup-redirect-btn" class="btn-secondary" style="margin-top: 8px;">Sign Up</button>
        </div>
        <div class="auth-prompt-footer">
          <a href="#" id="extension-settings-link">Extension Settings</a>
        </div>
      </div>
    </div>
  </div>
  
  <div id="settings-form" style="display: none;">
    <div class="form-group">
      <label for="api-url">Fuze API URL</label>
      <input type="url" id="api-url" placeholder="https://Ujjwaljain16-fuze-backend.hf.space">
    </div>
    
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="your@email.com">
    </div>
    
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Your password">
    </div>
    
    <button id="login-btn" class="btn">Login to Fuze</button>
    
    <div class="toggle-container">
      <label for="auto-sync">Auto-sync Chrome bookmarks</label>
      <label class="toggle">
        <input type="checkbox" id="auto-sync">
        <span class="slider"></span>
      </label>
    </div>
    
    <button id="save-settings" class="btn">Save Settings</button>
    <button id="import-bookmarks" class="btn" style="background: linear-gradient(to right, #4DD0E1, #14B8A6); margin-top: 8px;">Import All Bookmarks</button>
    <button id="back-button" class="btn" style="background-color: #6b7280; margin-top: 8px;">Back</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
